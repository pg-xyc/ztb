nt-weight:900;pointer-events:none;text-shadow:3px 3px #fffdf0;opacity:0}.score-float.go{animation:scoreUp 1.35s ease-out forwards}.score-float.good{color:#1f7040}.score-float.bad{color:#b23e31}@keyframes scoreUp{0%{opacity:0;transform:translateY(20px)}15%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translateY(-65px)}}.battle-dialog{margin:6px 14px 14px;border:4px solid #4b6652;border-radius:7px;box-shadow:inset 0 0 0 3px #dce4ce;background:#fffef1;padding:20px 22px;min-height:96px;display:flex;align-items:center;gap:12px;font-size:25px;line-height:1.4;font-weight:650}.battle-dialog .arrow{color:#aa6f42;font-size:22px}.question-panel{min-width:0;overflow-y:auto;padding:0 3px 6px;scrollbar-width:thin;scrollbar-color:#a5b996 transparent}.case-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}.event{font-size:22px;font-weight:750}.background{font-size:17px;background:#f5f8e9;border:1px solid #c1ceb2;padding:8px 12px;border-radius:5px;margin-bottom:14px}.background summary{cursor:pointer}.background p{font-size:19px;line-height:1.7;margin:10px 0 3px}.question{background:#fffdf1;border:2px solid #c5cfb8;box-shadow:0 3px 0 #d2dbc7;border-radius:7px;padding:20px 23px;margin-bottom:18px}.question-body{font-size:var(--reading);line-height:1.6;font-weight:560}.question-body mark{background:#f6d5a2;color:#673817;font-weight:750;padding:1px 2px}.ask{font-size:21px;font-weight:700;color:#34533c;margin-top:17px;padding-top:12px;border-top:1px dashed #bccaaa}.extra{font-size:19px;line-height:1.6;margin:14px 0 0;background:#edf2e2;border-radius:3px;padding:8px 10px}.options{display:grid;gap:11px}.option{position:relative;display:flex;gap:14px;align-items:flex-start;text-align:left;background:#fffef4;border:2px solid #b6c5a9;border-radius:7px;padding:14px 16px;font-size:var(--option);line-height:1.48;box-shadow:0 3px 0 #d3ddc7;transition:background .15s,border-color .15s}.option:hover:not(:disabled){background:#f0f5df;border-color:#50754c}.letter{flex-shrink:0;background:#e4ecd5;color:#38593b;border:1px solid #b6c7a4;display:grid;place-items:center;width:31px;height:32px;font-size:19px;font-weight:750}.option.correct{background:#e4f0d8;border-color:#2e7344}.option.correct .letter{color:white;background:#367d46;border-color:#367d46}.option.wrong{background:#fae8dc;border-color:#ac5443}.option.wrong .letter{color:white;background:#b35945;border-color:#b35945}.option.dim{opacity:.52}.option:disabled{color:var(--ink)}.feedback{margin-top:18px;border:2px solid #8aa77d;background:#f4f8e8;border-radius:7px;padding:20px;font-size:24px;line-height:1.65}.feedback.bad{border-color:#be8d71;background:#fff5e9}.feedback strong{font-size:25px}.feedback p{margin:9px 0 17px}.next{border:2px solid #365d42;background:#3b684a;color:#fffef2;padding:11px 23px;font-weight:650;font-size:22px;border-radius:5px;min-width:160px;box-shadow:0 3px 0 #27492f}.next:hover{background:#2f583d}.results{background:#fffdf0;border:3px solid #67805b;border-radius:8px;padding:26px}.results h2{font-size:32px;margin:0 0 20px}.results-score{font-size:55px;font-weight:800;margin:5px 0 12px}.results p{font-size:22px;line-height:1.7}.review-row{padding:12px 0;border-top:1px solid #d1dac2;font-size:21px}.review-row summary{display:flex;justify-content:space-between;gap:12px;cursor:pointer}.review-row p{font-size:20px}.pill{font-weight:700;color:#336b3e;white-space:nowrap}.pill.bad{color:#ab4c38}.modal-bg{position:fixed;inset:0;background:#1e352b88;display:grid;place-items:center;z-index:10;padding:20px}.modal-bg[hidden]{display:none}.modal{width:min(540px,100%);background:#fffef1;border:4px solid #48644a;border-radius:8px;padding:28px}.modal h2{margin:0 0 15px;font-size:27px}.modal p{font-size:22px;line-height:1.6}.modal-actions{display:flex;gap:12px;justify-content:flex-end}.modal-actions button{font-size:20px;padding:10px 17px;border:2px solid #8da57e;background:#edf2df;border-radius:4px}.modal-actions .restart{background:#396247;color:white;border-color:#396247}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:20;background:#263d2d;color:white;padding:12px 22px;border-radius:6px;font-size:20px}.toast[hidden]{display:none}body.large{--reading:33px;--option:27px}body.large .ask{font-size:25px}body.large .feedback{font-size:28px}@media(min-width:1600px){:root{--reading:32px;--option:26px}.battle-dialog{font-size:31px}.event{font-size:26px}.question{padding:25px}.feedback{font-size:28px}.round{font-size:27px}.round small{font-size:19px}.score-box b{font-size:46px}}@media(max-width:1000px){:root{--reading:24px;--option:20px}header{padding:0 16px}header h1{font-size:22px}main{gap:14px;padding:14px;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}.round{font-size:19px;padding:8px 11px;min-width:115px}.round small{font-size:14px}.battle-head{padding:14px 12px 4px}.battle-dialog{font-size:23px;padding:17px}.question{padding:17px}.option{padding:12px;gap:10px}.ask{font-size:19px}.feedback{font-size:23px}}@media(max-width:720px){:root{--reading:25px;--option:21px}header{height:auto;min-height:61px;padding:10px 13px;gap:8px}header h1{font-size:20px;letter-spacing:0}.tools{gap:5px}.icon{padding:4px 8px;min-height:33px;font-size:16px}main{height:auto;min-height:0;grid-template-columns:1fr;padding:12px;gap:18px}.battle{height:420px}.battle-head{padding:10px 13px 0}.scene{min-height:200px}.battle-dialog{min-height:64px;margin:0 10px 10px;padding:10px 16px;font-size:22px}.round{font-size:18px}.round small{display:inline;font-size:16px;margin-right:12px}.score-box b{font-size:28px;display:inline;margin-left:7px}.score-box small{margin-left:6px;font-size:12px}.question-panel{overflow:visible}.background{font-size:17px}.question{padding:18px}.feedback{font-size:23px}.letter{width:29px;height:30px}.option{padding:13px}.event{font-size:23px}body.large{--reading:30px;--option:25px}}

<header><h1>新余学院教学楼招标</h1><div class="tools"><button class="icon" onclick="toggleSize()" title="放大题目字号" aria-label="切换大字" id="sizeBtn">A＋</button><button class="icon" onclick="fullscreen()" title="全屏" aria-label="全屏">⛶</button><button class="icon" onclick="askRestart()" title="重新开始" aria-label="重新开始">↺</button></div></header>
<main><section class="battle" aria-label="像素回合制校园场景"><div class="battle-head"><div class="round"><small id="roundNo">1 / 10</small><span id="roundName">资格条件</span></div><div class="score-box">得分<b id="score">0</b><small>答对＋10 / 答错−5</small></div></div><div class="scene"><canvas id="battleCanvas" width="480" height="400" aria-label="学生背影位于左下方，审查对象位于右上方，背景为新余学院像素校园"></canvas><div class="score-float" id="floatScore" aria-hidden="true"></div></div><div class="battle-dialog" role="status"><span class="arrow" aria-hidden="true">▶</span><span id="battleText">请审查：资格条件</span></div></section><section class="question-panel" id="panel" aria-live="polite"></section></main>
<div class="modal-bg" id="resetModal" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="resetTitle"><h2 id="resetTitle">重新开始？</h2><p>将清空本轮作答和分数。</p><div class="modal-actions"><button onclick="closeReset()">取消</button><button class="restart" onclick="restart()">重新开始</button></div></div></div><div class="toast" id="toast" hidden role="status"></div>
<script>
'use strict';
const TASKS=[{"event":1,"part":"①","name":"资格条件","body":"为优选校园建设承包人，咨询企业项目经理规定：投标人近<mark>4年必须承担过高校教学楼工程</mark>，否则不通过资格审查。","answer":"不妥当。本项目为普通房屋建筑施工，没有技术复杂或特殊要求。将“高校教学楼”这一特定行业业绩作为资格条件，与实际施工需要不相适应，构成对潜在投标人的不合理限制、排斥。","options":["不妥当：普通教学楼没有特殊技术要求，限定高校教学楼业绩会不合理限制、排斥潜在投标人。","妥当：学校建设教学楼，只能由有高校教学楼业绩的企业投标。","妥当：只要把业绩年限限定为4年，就不存在不合理限制。","不妥当：施工招标一律不能设置任何类似工程业绩条件。"],"correct":0},{"event":1,"part":"②","name":"全国性奖项","body":"项目经理提出：投标人近<mark>4年获得过鲁班奖</mark>的，在资信评价中加分。该奖项与本项目工程质量评价相关，不作为投标资格门槛。","answer":"妥当（按本案例的参考答案口径）。鲁班奖属于全国性工程质量奖项，能反映企业施工质量和综合实力，并未限定某一行政区域。","options":["不妥当：全国性质量奖项与本省奖项都属于地域限制。","妥当：按本题口径，鲁班奖是全国性质量奖项，能够反映企业施工质量和实力。","妥当：获得鲁班奖的企业可以免于参加其他评审，直接中标。","不妥当：鲁班奖只能作为投标资格门槛，不能作为评分因素。"],"correct":1},{"event":1,"part":"③","name":"本省奖项","body":"项目经理同时规定：投标人近<mark>4年获得过江西省省级工程质量奖</mark>的，可以加分；外省同类省级奖项不计分。","answer":"不妥当。仅对江西省省级质量奖加分，属于以特定行政区域的奖项作为加分条件，构成对其他潜在投标人或投标人的不合理限制、排斥。","options":["妥当：工程位于江西，招标人可以只认可江西省的奖项。","不妥当：省级质量奖的获奖企业不能参加高校工程投标。","不妥当：限定江西省奖项加分，属于以特定行政区域奖项不合理限制、排斥投标人。","妥当：只要没有直接禁止外省企业投标，就不属于排斥。"],"correct":2},{"event":1,"part":"④","name":"投标保证金","body":"招标文件要求提交<mark>68万元投标保证金</mark>。境内投标单位以现金或者支票形式提交时，应从<mark>投标人基本账户</mark>转出；也允许按文件要求提交银行保函。","answer":"妥当。68万元未超过项目估算价11,200万元的2%（224万元），也未超过施工招标投标保证金80万元上限。依法必须招标的项目，境内投标单位以现金或者支票形式提交保证金，应从基本账户转出，有利于防止以他人名义投标。","options":["不妥当：68万元超过最高投标限价的2%。","妥当：保证金可由任何企业代为转出，只要金额不超过80万元。","不妥当：基本账户转出只适用于银行保函，不适用于现金或支票。","妥当：68万元低于估算价的2%且未超过80万元；现金或支票应从基本账户转出，有利于防止冒名投标。"],"correct":3},{"event":1,"part":"⑤","name":"履约保证金","body":"招标文件约定：中标人应提交的履约保证金为<mark>最高投标限价的12%</mark>，即1,296万元。","answer":"不妥当。履约保证金应以中标合同金额为基数，且不得超过中标合同金额的10%。本条以最高投标限价为基数，并规定12%，计取基数和比例均不妥当。","options":["不妥当：基数应为中标合同金额，且不得超过该金额的10%，本条基数与比例均有问题。","妥当：最高投标限价已经公开，可以按其12%收取履约保证金。","不妥当：只需把12%改成10%，仍可按最高投标限价计算。","不妥当：只需改用中标合同金额，12%的比例可以保留。"],"correct":0},{"event":2,"part":"事件2","name":"合同条款","body":"项目经理认为：“招标文件里的合同条款只是粗略框架。把施工合同示范文本中的项目名称、地点改成<mark>新余学院新建教学楼</mark>，直接附上即可。”","answer":"不妥当。合同条款是投标人报价的重要依据，不能只填项目基本信息。应参照合同示范文本，结合本项目特点、业主要求和实际情况编制，并在招标文件中附完整的合同条款。","options":["妥当：示范文本是统一文件，只改名称与地点就足够。","不妥当：合同是报价依据，应结合项目特点、业主要求及实际情况编制完整条款。","不妥当：任何项目都不得参照施工合同示范文本。","妥当：合同细节等中标后再谈，不会影响投标报价。"],"correct":1},{"event":3,"part":"事件3","name":"评标方法","body":"编制人员准备研究本项目的评标办法。项目经理说：“我们以前的项目一直用<mark>综合评估法</mark>，这次也照着用，不必再研究项目特点和目标。”","answer":"不妥当。应结合本项目的特点、目标要求及适用条件确定评标方法，不能仅因咨询企业以往常用综合评估法而直接照搬。综合评估法本身并非必然不适用。","options":["不妥当：任何普通教学楼项目都绝对不能采用综合评估法。","妥当：同一家咨询企业应当对所有工程采用同一种评标方法。","不妥当：不能只凭以往习惯，应结合本项目特点、目标要求及适用条件确定评标方法。","妥当：项目经理有经验，就无需再分析本项目的情况。"],"correct":2},{"event":4,"part":"事件4","name":"清单漏项","body":"技术负责人审核时发现，工程量清单漏列<mark>屋面防水工程</mark>，要求修改。项目经理说：“今晚就要交给学校，合同已有漏项处理条款，<mark>不必再改</mark>。”","answer":"不妥当。已发现漏项，应及时组织修改，不能以交付时间紧或已有漏项处理约定为由放任错误。漏项可能引发合同履行期间的价款调整或纠纷，也可能被承包人用于不平衡报价。","options":["妥当：合同已约定漏项处理，编制时可以不补漏项。","不妥当：应先让投标人自行补齐，咨询企业不需要修改。","妥当：交付时间比清单完整性重要，漏项不影响报价策略。","不妥当：应及时组织修改；漏项可能引发价款调整、履约纠纷，还可能被用于不平衡报价。"],"correct":3},{"event":5,"part":"事件5","name":"咨询委托","body":"咨询企业已经接受学校委托编制招标文件和最高投标限价。负责人认为：“<mark>限价会公开，不用保密</mark>，所以可以再接受某拟投标人委托，为其提供<mark>本项目报价咨询</mark>。”","answer":"不妥当。咨询企业已接受招标人委托编制该项目招标文件和最高投标限价，不得再就同一项目接受拟投标人委托编制投标报价或提供咨询。限价公开不消除同一项目的利益冲突。","options":["不妥当：已接受招标人委托，不得再为同一项目拟投标人提供报价咨询；限价公开不能消除利益冲突。","妥当：最高投标限价会公开，就可以同时接受双方的咨询委托。","妥当：只要双方分别付费，就不存在利益冲突。","不妥当：最高投标限价必须永久保密，因此不能接受委托。"],"correct":0},{"event":6,"part":"事件6","name":"计价依据","body":"为压低报价水平，咨询企业与学校商定：采用代表省内先进管理水平的<mark>某先进施工企业的企业定额</mark>作为本项目最高投标限价的编制依据。","answer":"不妥当。按本案例参考答案口径，最高投标限价应依据国家或省级、行业建设主管部门颁发、反映社会平均水平的计价定额等编制，不能以某一家先进施工企业的企业定额取代适用计价依据。","options":["妥当：先进施工企业的成本最低，适合直接作为所有投标人的统一限价依据。","不妥当：按本题口径，应采用主管部门颁发、反映社会平均水平的适用计价定额，不能用单个先进企业定额替代。","不妥当：最高投标限价必须根据每家投标人的报价取平均值编制。","妥当：业主与咨询企业商定后，任何企业定额都可以作为限价依据。"],"correct":1}];
const $=id=>document.getElementById(id),KEY='xyu-pixel-battle-v1';
const fresh=()=>({version:1,current:0,answers:Array(10).fill(null),finished:false});
let state=fresh();try{const x=JSON.parse(localStorage.getItem(KEY));if(x?.version===1&&Array.isArray(x.answers)&&x.answers.length===10&&x.answers.every(v=>v===null||Number.isInteger(v)&&v>=0&&v<4)&&Number.isInteger(x.current)&&x.current>=0&&x.current<10)state=x;}catch{}
let anim={kind:'idle',start:0},locked=false,revealTimer=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{}}
function getScore(){return state.answers.reduce((n,a,i)=>n+(a===null?0:a===TASKS[i].correct?10:-5),0);}
function answered(){return state.answers.filter(a=>a!==null).length;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function promptText(t){return t.event===1?`事件1 · ${t.part}`:`事件${t.event}`;}
function render(){const t=TASKS[state.current],picked=state.answers[state.current],done=picked!==null;$('roundNo').textContent=state.finished?'10 / 10':`${state.current+1} / 10`;$('roundName').textContent=state.finished?'审查完成':t.name;$('score').textContent=getScore();
if(state.finished){renderResults();$('battleText').textContent=`审查完成，得分 ${getScore()}`;return;}
$('battleText').textContent=done?(picked===t.correct?'判断与理由正确，＋10分':'判断或理由有误，−5分'):`请审查：${t.name}`;

function choose(k){if(locked||state.finished||state.answers[state.current]!==null||!Number.isInteger(k)||k<0||k>3)return;state.answers[state.current]=k;save();locked=true;const ok=k===TASKS[state.current].correct;anim={kind:ok?'correct':'wrong',start:performance.now()};render();$('battleText').textContent=ok?'判断与理由正确，＋10分':'判断或理由有误，−5分';const f=$('floatScore');f.textContent=ok?'+10':'−5';f.className='score-float';void f.offsetWidth;f.className='score-float go '+(ok?'good':'bad');clearTimeout(revealTimer);revealTimer=setTimeout(()=>{locked=false;const b=$('panel').querySelector('.next');if(b)b.disabled=false;},1150);}
function nextTurn(){if(locked||state.answers[state.current]===null||state.finished)return;if(state.current===9){state.finished=true;anim={kind:'win',start:performance.now()};}else{state.current++;anim={kind:'entry',start:performance.now()};}save();render();$('panel').scrollTop=0;}
function renderResults(){const right=state.answers.filter((a,i)=>a===TASKS[i].correct).length;$('panel').innerHTML=`<div class="results"><h2>审查完成</h2><div class="results-score">${getScore()} 分</div><p>答对 ${right} 项，答错 ${10-right} 项</p>${TASKS.map((t,i)=>`<details class="review-row"><summary><span>${i+1}. ${t.name}</span><span class="pill ${state.answers[i]===t.correct?'':'bad'}">${state.answers[i]===t.correct?'+10':'−5'}</span></summary><p>${t.body}</p><p><b>所选：</b>${t.options[state.answers[i]]}</p><p><b>正确判断与理由：</b>${t.answer}</p></details>`).join('')}<p><button class="next" onclick="askRestart()">重新开始</button></p></div>`;}
function toggleSize(){const on=document.body.classList.toggle('large');$('sizeBtn').textContent=on?'A−':'A＋';$('sizeBtn').setAttribute('aria-pressed',on);}
function askRestart(){$('resetModal').hidden=false;$('resetModal').querySelector('button').focus();}
function closeReset(){$('resetModal').hidden=true;}
function restart(){clearTimeout(revealTimer);locked=false;state=fresh();anim={kind:'entry',start:performance.now()};$('floatScore').className='score-float';save();closeReset();render();$('panel').scrollTop=0;}
function toast(s){$('toast').textContent=s;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,3000);}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{toast('请使用浏览器的全屏功能。');}}
document.addEventListener('keydown',e=>{if(!$('resetModal').hidden){if(e.key==='Escape')closeReset();if(e.key==='Tab'){const bs=$('resetModal').querySelectorAll('button');if(e.shiftKey&&document.activeElement===bs[0]){e.preventDefault();bs[1].focus();}else if(!e.shiftKey&&document.activeElement===bs[1]){e.preventDefault();bs[0].focus();}}return;}if(e.repeat||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(['1','2','3','4'].includes(e.key)){choose(Number(e.key)-1);}if(e.key==='ArrowRight')nextTurn();});

function burst(x,y,t,color){for(let i=0;i<9;i++){const a=i*6.283/9,r=7+t*36;rect(x+Math.cos(a)*r,y+Math.sin(a)*r,4,4,color);}rect(x-5,y-1,10,3,color);rect(x-1,y-5,3,10,color);}
function projectile(from,to,p,color){const x=from[0]+(to[0]-from[0])*p,y=from[1]+(to[1]-from[1])*p-Math.sin(p*Math.PI)*28;rect(x-5,y-5,11,13,'#3d5a45');rect(x-4,y-6,9,12,'#fff5d3');rect(x-2,y-3,5,2,color);rect(x-2,y+1,4,1,color);for(let k=1;k<=3;k++)rect(x-5-k*5,y+k*2,3,2,color);}
function paint(time){requestAnimationFrame(paint);if(time-lastFrame<32)return;lastFrame=time;ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,480,400);backdrop();const age=time-anim.start;let studentDx=0,npcDx=0,fade=1;
